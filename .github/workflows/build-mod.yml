name: Build CYBER//UI mod

on:
  push:
    paths:
      - "mod/**"
      - ".github/workflows/build-mod.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build
        working-directory: mod
        run: gradle build --stacktrace

      - name: Check Minecraft signatures used by mixins
        run: bash .github/scripts/check-mixin-targets.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cyber-ui-mod
          path: mod/build/libs/*.jar

      - name: Publish release "mod-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls mod/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$JAR" cyber-ui-mod-26.3.jar
          gh release delete mod-latest --cleanup-tag --yes || true
          gh release create mod-latest cyber-ui-mod-26.3.jar \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CYBER//UI mod (latest build)" \
            --notes "Fabric 26.3 (Java 25). Put the jar into the mods folder. Built from ${GITHUB_SHA}."
