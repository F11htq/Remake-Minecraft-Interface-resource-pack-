name: Build CYBER//UI mod

on:
  push:
    paths:
      - "mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"

      - name: Build
        working-directory: mod
        run: gradle build --stacktrace

      - name: Dump Minecraft signatures (debug)
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches/fabric-loom mod/.gradle -name "minecraft-*1.21.4*.jar" 2>/dev/null | grep -v sources | grep -iE "merged|client|common" | head -n 1)
          echo "jar: $JAR"
          for c in net.minecraft.client.renderer.CubeMap \
                   net.minecraft.client.gui.components.LogoRenderer \
                   net.minecraft.client.gui.components.SplashRenderer \
                   net.minecraft.client.gui.screens.LoadingOverlay \
                   net.minecraft.client.gui.screens.TitleScreen; do
            javap -p -s -cp "$JAR" "$c" || true
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cyber-ui-mod
          path: mod/build/libs/*.jar

      - name: Publish release "mod-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls mod/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          cp "$JAR" cyber-ui-mod-1.21.4.jar
          gh release delete mod-latest --cleanup-tag --yes || true
          gh release create mod-latest cyber-ui-mod-1.21.4.jar \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "CYBER//UI mod (latest build)" \
            --notes "Fabric 1.21.4. Put the jar into the mods folder. Built from ${GITHUB_SHA}."
